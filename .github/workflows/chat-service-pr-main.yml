name: Chat Service - Pull Request to mai CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'services/chat-service/**'
      - '.github/workflows/chat-service-pr-main.yml'

jobs:
  build:
    name: Build and Verify
    runs-on: ubuntu-latest
    defaults: 
      run: 
        working-directory: ./services/chat-service/ChatService/

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log information
        run: |
          echo "Pull Request #${{ github.event.number }} opened by ${{ github.event.pull_request.user.login }}"
          echo "Source branch: ${{ github.head_ref }}"
          echo "Target branch: ${{ github.base_ref }}"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          cache: true
          cache-dependency-path: services/chat-service/ChatService/ChatService.csproj

      - name: Restore NuGet Packages
        run: dotnet restore

      - name: Build Project
        run: dotnet build

      - name: Run Tests
        run: echo "Test if have some test cases"

      