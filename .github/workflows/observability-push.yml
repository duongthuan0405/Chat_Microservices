name: Deploy Observability Stack

on:
  push:
    branches:
      - main
    paths:
      - 'k8s/observability/**'
      - '.github/workflows/observability-push.yml'
      - 'services/**'

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Prometheus and Grafana to Kubernetes
    runs-on: ubuntu-latest
    environment: ObservabilityProduction
    env:
      DEPLOY_DIR: /tmp/deploy-observability-${{ github.run_id }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy Observability Manifests to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "k8s/observability/*.yaml"
          target: ${{ env.DEPLOY_DIR }}

      - name: SSH into VPS and Apply Observability Stack
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            DEPLOY_DIR="${{ env.DEPLOY_DIR }}"
            trap "rm -rf $DEPLOY_DIR" EXIT

            set -e

            if [ -f /etc/rancher/k3s/k3s.yaml ]; then
              export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            fi

            echo "Checking Kubernetes cluster..."
            kubectl get nodes

            echo "Applying Prometheus and Grafana manifests..."

            echo "Creating Grafana admin secret..."
            kubectl create secret generic grafana-admin-secret \
              --from-literal=admin-user='${{ secrets.GRAFANA_ADMIN_USER }}' \
              --from-literal=admin-password='${{ secrets.GRAFANA_ADMIN_PASSWORD }}' \
              -n default \
              --dry-run=client -o yaml | kubectl apply -f -

            kubectl apply -f $DEPLOY_DIR/k8s/observability/prometheus-configmap.yaml
            kubectl apply -f $DEPLOY_DIR/k8s/observability/prometheus-deployment.yaml
            kubectl apply -f $DEPLOY_DIR/k8s/observability/prometheus-service.yaml

            kubectl apply -f $DEPLOY_DIR/k8s/observability/grafana-datasource-configmap.yaml
            kubectl apply -f $DEPLOY_DIR/k8s/observability/grafana-dashboard-configmap.yaml
            kubectl apply -f $DEPLOY_DIR/k8s/observability/grafana-deployment.yaml
            kubectl apply -f $DEPLOY_DIR/k8s/observability/grafana-service.yaml

            echo "Restarting Prometheus and Grafana..."
            kubectl rollout restart deployment/prometheus -n default || true
            kubectl rollout restart deployment/grafana -n default || true

            echo "Waiting for rollout..."
            kubectl rollout status deployment/prometheus -n default --timeout=180s
            kubectl rollout status deployment/grafana -n default --timeout=180s

            echo "Observability stack status:"
            kubectl get pods -l app=prometheus -n default
            kubectl get pods -l app=grafana -n default
            kubectl get svc prometheus-service -n default
            kubectl get svc grafana-service -n default

            echo "Detailed pod status:"
            kubectl get pods -l app=prometheus -n default -o wide
            kubectl get pods -l app=grafana -n default -o wide

            echo "Prometheus logs:"
            kubectl logs -l app=prometheus -n default --tail=80 || true

            echo "Grafana logs:"
            kubectl logs -l app=grafana -n default --tail=80 || true

            echo "Testing Prometheus readiness from inside cluster..."
            kubectl run prometheus-health-check-${{ github.run_id }} \
              --rm -i \
              --restart=Never \
              --image=curlimages/curl \
              -- curl -sS http://prometheus-service.default.svc.cluster.local:9090/-/ready

            echo "Waiting for Grafana service endpoints..."
            for i in $(seq 1 30); do
              kubectl get endpoints grafana-service -n default

              if kubectl get endpoints grafana-service -n default | grep -q ":3000"; then
                echo "Grafana endpoint is available."
                break
              fi

              echo "Grafana endpoint is not ready yet. Retry $i/30..."
              sleep 5
            done

            echo "Testing Grafana health from inside cluster..."
            kubectl run grafana-health-check-${{ github.run_id }} \
              --rm -i \
              --restart=Never \
              --image=curlimages/curl \
              -- sh -c '
                for i in $(seq 1 30); do
                  echo "Checking Grafana health attempt $i/30..."
                  if curl -fsS http://grafana-service.default.svc.cluster.local/api/health; then
                    exit 0
                  fi
                  sleep 5
                done

                echo "Grafana health check failed after retries."
                exit 1
              '

            echo "Testing Prometheus targets API..."
            kubectl run prometheus-targets-check-${{ github.run_id }} \
              --rm -i \
              --restart=Never \
              --image=curlimages/curl \
              -- sh -c "curl -sS http://prometheus-service.default.svc.cluster.local:9090/api/v1/targets | head -c 3000"

            echo ""
            echo "Testing metrics endpoints from inside cluster..."

            kubectl run metrics-endpoints-check-${{ github.run_id }} \
              --rm -i \
              --restart=Never \
              --image=curlimages/curl \
              -- sh -c '
                set -e

                echo "Checking auth-service metrics..."
                curl -fsS http://auth-service.default.svc.cluster.local:3667/metrics | head -20

                echo "Checking chat-service metrics..."
                curl -fsS http://chat-service.default.svc.cluster.local:80/metrics | head -20

                echo "Checking conversation-service metrics..."
                curl -fsS http://conversation-service.default.svc.cluster.local:8083/metrics | head -20

                echo "Checking friendship-service metrics..."
                curl -fsS http://friendship-service.default.svc.cluster.local:8081/metrics | head -20

                echo "Checking notification-service metrics..."
                curl -fsS http://notification-service.default.svc.cluster.local:80/metrics | head -20
              '

            echo "Ingress status:"
            kubectl get ingress -n default -o wide || true
            kubectl describe ingress api-gateway-ingress-public -n default || true