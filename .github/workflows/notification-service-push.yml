name: Notification Service - Push CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'services/notification-service/**'
      - '.github/workflows/notification-service-push.yml'

jobs:
  build-publish:
    name: Build & Publish to Docker Hub
    runs-on: ubuntu-latest
    defaults: 
      run: 
        working-directory: ./services/notification-service/NotificationService/

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          cache: true
          cache-dependency-path: services/notification-service/NotificationService/NotificationService.csproj

      - name: Restore NuGet Packages
        run: dotnet restore

      - name: Build Project
        run: dotnet build --configuration Release --no-restore

      - name: Run Tests
        run: echo "Test if have some test cases"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/notification-service
          tags: |
            type=sha,format=long
            latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: services/notification-service/NotificationService/
          file: services/notification-service/NotificationService/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Deployment (FAKE)
        run: echo "Deployment placeholder"

