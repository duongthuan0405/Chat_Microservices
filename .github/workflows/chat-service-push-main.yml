name: Chat Service - Push to main CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'services/chat-service/**'
      - '.github/workflows/chat-service-push-main.yml'

  workflow_dispatch:
    inputs:
      imageTag:
        description: Docker image tag
        required: true
        
jobs:
  build-publish:
    name: Build & Publish to Azure ACR
    runs-on: ubuntu-latest
    environment: ChatServiceProduction
    env:
      DEPLOY_DIR: /tmp/deploy-manifests-chat-${{ github.run_id }}
    defaults: 
      run: 
        working-directory: ./services/chat-service/ChatService/

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          cache: true
          cache-dependency-path: services/chat-service/ChatService/ChatService.csproj

      - name: Restore NuGet Packages
        run: dotnet restore

      - name: Build Project
        run: dotnet build --configuration Release --no-restore

      - name: Run Tests
        run: echo "Test if have some test cases"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/${{ secrets.DOCKER_IMAGE }}
          tags: |
            type=sha,format=long
            latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: services/chat-service/ChatService/
          file: services/chat-service/ChatService/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      
      # copy deployment manifests to VPS
      - name: Copy Manifests to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "k8s/deployments/chat-service/*.yaml"
          target: ${{ env.DEPLOY_DIR }}
      
      - name: SSH into vps
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            DEPLOY_DIR="${{ env.DEPLOY_DIR }}"
            trap "rm -rf $DEPLOY_DIR" EXIT
            
            # Pull the latest image
            podman login -u ${{ secrets.AZURE_ACR_USERNAME }} -p ${{ secrets.AZURE_ACR_PASSWORD }} ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
            podman pull ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/${{ secrets.DOCKER_IMAGE }}:latest

            set -e
            # Ensure kubectl can access the cluster (k3s fallback)
            if [ -f /etc/rancher/k3s/k3s.yaml ]; then
              export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            fi

            # Create/update imagePullSecret for ACR
            kubectl create secret docker-registry acr-secret \
              --docker-server=${{ secrets.AZURE_ACR_LOGIN_SERVER }} \
              --docker-username='${{ secrets.AZURE_ACR_USERNAME }}' \
              --docker-password='${{ secrets.AZURE_ACR_PASSWORD }}' \
              --dry-run=client -o yaml | kubectl apply -f -

            # Create/update app secrets securely
            kubectl create secret generic chat-service-secret \
              --from-literal=DB_HOST='${{ secrets.DB_HOST }}' \
              --from-literal=DB_PORT='${{ secrets.DB_PORT }}' \
              --from-literal=DB_USERNAME='${{ secrets.DB_USERNAME }}' \
              --from-literal=DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
              --from-literal=DB_DATABASE='${{ secrets.DB_DATABASE }}' \
              --from-literal=RABBITMQ_HOST='${{ secrets.RABBITMQ_HOST }}' \
              --from-literal=RABBITMQ_PORT='${{ secrets.RABBITMQ_PORT }}' \
              --from-literal=RABBITMQ_USERNAME='${{ secrets.RABBITMQ_USERNAME }}' \
              --from-literal=RABBITMQ_PASSWORD='${{ secrets.RABBITMQ_PASSWORD }}' \
              --from-literal=CONVERSATION_SERVICE_URL='${{ secrets.CONVERSATION_SERVICE_URL }}' \
              --dry-run=client -o yaml | kubectl apply -f -

            # Replace ONLY the non-secret metadata (Image Tag and Port)
            MANIFEST_PATH="$DEPLOY_DIR/k8s/deployments/chat-service/chat-service-deployment.yaml"
            sed -i "s|\${DOCKER_USERNAME}/\${DOCKER_IMAGE}|${{ secrets.AZURE_ACR_LOGIN_SERVER }}/${{ secrets.DOCKER_IMAGE }}:latest|g" $MANIFEST_PATH
            sed -i "s|\${APP_CONTAINER_PORT}|${{secrets.APP_CONTAINER_PORT}}|g" $MANIFEST_PATH

            SVC_MANIFEST_PATH="$DEPLOY_DIR/k8s/deployments/chat-service/chat-service-service.yaml"
            sed -i "s|\${APP_PORT}|${{secrets.APP_PORT}}|g" $SVC_MANIFEST_PATH
            sed -i "s|\${APP_CONTAINER_PORT}|${{secrets.APP_CONTAINER_PORT}}|g" $SVC_MANIFEST_PATH

            JOB_MANIFEST_PATH="$DEPLOY_DIR/k8s/deployments/chat-service/chat-service-migration-job.yaml"
            sed -i "s|\${DOCKER_USERNAME}/\${DOCKER_IMAGE}|${{ secrets.AZURE_ACR_LOGIN_SERVER }}/${{ secrets.DOCKER_IMAGE }}:latest|g" $JOB_MANIFEST_PATH

            # Clean up old migration job if it exists
            kubectl delete job chat-service-migration-job -n default --ignore-not-found=true

            # Apply and wait for the migration job
            kubectl apply -f $JOB_MANIFEST_PATH
            echo "Waiting for migration job to complete..."
            kubectl wait --for=condition=complete job/chat-service-migration-job -n default --timeout=120s

            # Apply Service and Deployment manifests copied to VPS
            kubectl apply -f $MANIFEST_PATH
            kubectl apply -f $SVC_MANIFEST_PATH

            # Force Kubernetes to restart the pods to pull the newly updated :latest image
            kubectl rollout restart deployment/chat-service -n default

            # Show status
            kubectl rollout status deployment/chat-service -n default || true
            kubectl get pods -l app=chat-service -n default