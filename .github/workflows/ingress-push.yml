name: Deploy API Gateway Ingress

on:
  push:
    branches:
      - main
    paths:
      - 'k8s/infrastructure/api-gateway-ingress.yaml'
      - '.github/workflows/ingress-push.yml'

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Ingress to Kubernetes
    runs-on: ubuntu-latest
    environment: IngressProduction
    env:
      DEPLOY_DIR: /tmp/deploy-ingress-${{ github.run_id }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy Ingress Manifest to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "k8s/infrastructure/api-gateway-ingress.yaml"
          target: ${{ env.DEPLOY_DIR }}

      - name: SSH into VPS and Apply Ingress
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            DEPLOY_DIR="${{ env.DEPLOY_DIR }}"
            trap "rm -rf $DEPLOY_DIR" EXIT
            
            set -e
            # Ensure kubectl can access the cluster (k3s fallback)
            if [ -f /etc/rancher/k3s/k3s.yaml ]; then
              export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            fi

            MANIFEST_PATH="$DEPLOY_DIR/k8s/infrastructure/api-gateway-ingress.yaml"
            
            echo "Applying Ingress Manifest..."
            kubectl apply -f $MANIFEST_PATH
            
            echo "Ingress deployed successfully!"
            kubectl get ingress -n default