name: Auth Service - Push to main CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'services/auth-service/**'
      - '.github/workflows/auth-service-push-main.yml'

  workflow_dispatch:
    inputs:
      imageTag:
        description: Docker image tag
        required: true

jobs:
  build-publish:
    name: Build, Login to Azure, and Publish to ACR
    runs-on: ubuntu-latest
    environment: AuthServiceProduction
    defaults:
      run:
        working-directory: ./services/auth-service/

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: services/auth-service/auth-service.csproj

      - name: Restore NuGet Packages
        run: dotnet restore

      - name: Build Project
        run: dotnet build --configuration Release --no-restore

      - name: Run Tests
        run: echo "Test if have some test cases"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/${{ secrets.DOCKER_IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
            type=raw,value=${{ github.event.inputs.imageTag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: services/auth-service/
          file: services/auth-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # copy deployment manifests to VPS
      - name: Copy Manifests to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "k8s/deployments/auth-service/*.yaml"
          target: "/tmp/deploy-manifests/"
      
      - name: SSH into vps
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Pull the latest image
            podman login -u ${{ secrets.AZURE_ACR_USERNAME }} -p ${{ secrets.AZURE_ACR_PASSWORD }} ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
            podman pull ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/${{ secrets.DOCKER_IMAGE }}:latest

            set -e
            # Ensure kubectl can access the cluster (k3s fallback)
            if [ -f /etc/rancher/k3s/k3s.yaml ]; then
              export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            fi

            # Create/update imagePullSecret for ACR
            kubectl create secret docker-registry acr-secret \
              --docker-server=${{ secrets.AZURE_ACR_LOGIN_SERVER }} \
              --docker-username='${{ secrets.AZURE_ACR_USERNAME }}' \
              --docker-password='${{ secrets.AZURE_ACR_PASSWORD }}' \
              --dry-run=client -o yaml | kubectl apply -f -

            # Create/update app secrets
            kubectl create secret generic auth-service-secret \
              --from-literal=DEFAULT_CONNECTION_STRING='${{ secrets.AUTH_CONNECTION_STRING }}' \
              --from-literal=JWT_AUDIENCE='${{ secrets.JWT_AUDIENCE }}' \
              --from-literal=JWT_ISSUER='${{ secrets.JWT_ISSUER }}' \
              --from-literal=JWT_SECRET='${{ secrets.JWT_SECRET }}' \
              --dry-run=client -o yaml | kubectl apply -f -

            # Apply Service and Deployment manifests copied to VPS
            kubectl apply -f /tmp/deploy-manifests/k8s/deployments/auth-service/auth-service-deployment.yaml
            kubectl apply -f /tmp/deploy-manifests/k8s/deployments/auth-service/auth-service-service.yaml
            kubectl apply -f /tmp/deploy-manifests/k8s/deployments/auth-service/auth-service-secret.yaml

            # Show status
            kubectl rollout status deployment/auth-service -n default || true
            kubectl get pods -l app=auth-service -n default
