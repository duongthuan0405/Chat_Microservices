# RabbitMQ
services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ${RABBITMQ_CONTAINER_NAME}
    restart: unless-stopped
    env_file:
      - .env.rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_HOST_PORT}:${RABBITMQ_CONTAINER_PORT}"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT}:${RABBITMQ_MANAGEMENT_CONTAINER_PORT}"

  notification-db:
    image: postgres:17-alpine
    container_name: ${DB_CONTAINER_NAME}
    restart: unless-stopped
    env_file:
      - .env.postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "${DB_HOST_PORT}:${DB_CONTAINER_PORT}"
    volumes:
      - notification_data:/var/lib/postgresql/data

  notification-service:
    image: duongthuan0405/notification-service-dev:latest
    container_name: ${NOTIFICATION_SERVICE_CONTAINER_NAME}
    env_file:
      - .env.service
    ports:
      - "${ASPNETCORE_HOST_PORT}:${ASPNETCORE_CONTAINER_PORT}"
    depends_on:
      - notification-db
      - rabbitmq

volumes:
  notification_data:
