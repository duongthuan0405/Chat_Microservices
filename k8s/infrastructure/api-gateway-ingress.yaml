# 1. PUBLIC INGRESS (Không cần xác thực)
# Dành cho các endpoint Login, Register của Auth Service và Grafana
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-ingress-public
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    
    # Kích hoạt CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "http://localhost:5173"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,x-signalr-user-agent"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    # Tắt HTTPS redirect nếu bạn chỉ dùng HTTP
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - host: tmd.koreacentral.cloudapp.azure.com
    http:
      paths:
      # Auth Service (Login, Register...)
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 3667

      # Grafana Dashboard
      - path: /grafana
        pathType: Prefix
        backend:
          service:
            name: grafana-service
            port:
              number: 80

---

# 2. PRIVATE INGRESS (Bắt buộc xác thực)
# Dành cho các Service yêu cầu đăng nhập
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-ingress-private
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    
    # Kích hoạt WebSocket (cần cho SignalR)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    
    # Kích hoạt CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "http://localhost:5173"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,x-signalr-user-agent"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    # Tắt HTTPS redirect
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

    # BỎ QUA AUTHENTICATION CHO CÁC REQUEST OPTIONS (CORS PREFLIGHT)
    nginx.ingress.kubernetes.io/auth-snippet: |
      if ($request_method = 'OPTIONS') {
        return 204;
      }

    # CẤU HÌNH AUTHENTICATION OFFLOADING
    nginx.ingress.kubernetes.io/auth-url: "http://auth-service.default.svc.cluster.local:3667/api/auth/verify-token"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-User-Id, X-User-Email"
    
spec:
  rules:
  - host: tmd.koreacentral.cloudapp.azure.com
    http:
      paths:
      # Chat Service (REST API + SignalR)
      - path: /api/messages
        pathType: Prefix
        backend:
          service:
            name: chat-service
            port:
              number: 80
              
      - path: /hubs/chat
        pathType: Prefix
        backend:
          service:
            name: chat-service
            port:
              number: 80

      # Auth Service (Profile & Users)
      - path: /api/profile
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 3667

      - path: /api/users
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 3667

      # Notification Service (SignalR & REST APIs)
      - path: /hubs/notifications
        pathType: Prefix
        backend:
          service:
            name: notification-service
            port:
              number: 80
      - path: /api/notifications
        pathType: Prefix
        backend:
          service:
            name: notification-service
            port:
              number: 80
      - path: /api/preferences
        pathType: Prefix
        backend:
          service:
            name: notification-service
            port:
              number: 80
      - path: /api/templates
        pathType: Prefix
        backend:
          service:
            name: notification-service
            port:
              number: 80

      # Conversation Service (REST API)
      - path: /api/conversations
        pathType: Prefix
        backend:
          service:
            name: conversation-service
            port:
              number: 8083

      # Friendship Service (REST API)
      - path: /api/friendships
        pathType: Prefix
        backend:
          service:
            name: friendship-service
            port:
              number: 8081
