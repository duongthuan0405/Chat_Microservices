apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: default
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-secret
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-secret
                  key: admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_SERVER_ROOT_URL
              value: "%(protocol)s://%(domain)s/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
          volumeMounts:
            - name: grafana-datasource-volume
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboard-provider-volume
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboard-volume
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: grafana-datasource-volume
          configMap:
            name: grafana-datasource-config
            items:
              - key: datasource.yml
                path: datasource.yml
        - name: grafana-dashboard-provider-volume
          configMap:
            name: grafana-dashboard-config
            items:
              - key: dashboard-provider.yml
                path: dashboard-provider.yml
        - name: grafana-dashboard-volume
          configMap:
            name: grafana-dashboard-config
            items:
              - key: microservices-overview.json
                path: microservices-overview.json