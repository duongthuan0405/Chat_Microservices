apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      imagePullSecrets:
      - name: acr-secret
      containers:
        - name: auth-service
          image:
            valueFrom:
              secretKeyRef:
                name: acr-secret
                key: DOCKER_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: DEFAULT_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: DEFAULT_CONNECTION_STRING