apiVersion: apps/v1
kind: Deployment
metadata:
  name: conversation-service
  namespace: default
  labels:
    app: conversation-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: conversation-service
  template:
    metadata:
      labels:
        app: conversation-service
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: conversation-service
          image: ${DOCKER_USERNAME}/${DOCKER_IMAGE}
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
          envFrom:
            - secretRef:
                name: conversation-service-secret
          resources:
            limits:
              cpu: "300m"
              memory: "256Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 60