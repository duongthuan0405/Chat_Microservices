apiVersion: batch/v1
kind: Job
metadata:
  name: notification-service-migration-job
  namespace: default
spec:
  template:
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: notification-service-migration
          image: ${DOCKER_USERNAME}/${DOCKER_IMAGE}
          imagePullPolicy: Always
          args: ["--migrate"]
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
          envFrom:
            - secretRef:
                name: notification-service-secret
      restartPolicy: OnFailure
  backoffLimit: 3
