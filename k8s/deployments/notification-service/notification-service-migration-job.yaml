apiVersion: batch/v1
kind: Job
metadata:
  name: notification-service-migration-job
  namespace: default
spec:
  template:
    spec:
      containers:
        - name: notification-service-migration
          image: ${DOCKER_USERNAME}/${DOCKER_IMAGE}
          imagePullPolicy: Always
          args: ["--migrate"]
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: DB_HOST
              value: "${DB_HOST}"
            - name: DB_PORT
              value: "${DB_PORT}"
            - name: DB_USERNAME
              value: "${DB_USERNAME}"
            - name: DB_PASSWORD
              value: "${DB_PASSWORD}"
            - name: DB_DATABASE
              value: "${DB_DATABASE}"
            - name: RABBITMQ_HOST
              value: "${RABBITMQ_HOST}"
            - name: RABBITMQ_PORT
              value: "${RABBITMQ_PORT}"
            - name: RABBITMQ_USERNAME
              value: "${RABBITMQ_USERNAME}"
            - name: RABBITMQ_PASSWORD
              value: "${RABBITMQ_PASSWORD}"
      restartPolicy: OnFailure
  backoffLimit: 3
