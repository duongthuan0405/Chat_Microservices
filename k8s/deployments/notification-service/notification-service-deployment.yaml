apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: default
  labels:
    app: notification-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: ${DOCKER_USERNAME}/${DOCKER_IMAGE}
          imagePullPolicy: Always
          ports:
            - containerPort: ${APP_CONTAINER_PORT}
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: DB_HOST
              value: "${DB_HOST}"
            - name: DB_PORT
              value: "${DB_PORT}"
            - name: DB_USERNAME
              value: "${DB_USERNAME}"
            - name: DB_PASSWORD
              value: "${DB_PASSWORD}"
            - name: DB_DATABASE
              value: "${DB_DATABASE}"
            - name: RABBITMQ_HOST
              value: "${RABBITMQ_HOST}"
            - name: RABBITMQ_PORT
              value: "${RABBITMQ_PORT}"
            - name: RABBITMQ_USERNAME
              value: "${RABBITMQ_USERNAME}"
            - name: RABBITMQ_PASSWORD
              value: "${RABBITMQ_PASSWORD}"
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: ${APP_CONTAINER_PORT}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /live
              port: ${APP_CONTAINER_PORT}
            initialDelaySeconds: 15
            periodSeconds: 60
