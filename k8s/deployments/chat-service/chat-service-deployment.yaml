apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: default
  labels:
    app: chat-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: chat-service
          image: ${DOCKER_USERNAME}/${DOCKER_IMAGE}
          imagePullPolicy: Always
          ports:
            - containerPort: ${APP_CONTAINER_PORT}
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
          envFrom:
            - secretRef:
                name: chat-service-secret

          readinessProbe:
            httpGet:
              path: /ready
              port: ${APP_CONTAINER_PORT}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /live
              port: ${APP_CONTAINER_PORT}
            initialDelaySeconds: 15
            periodSeconds: 60
